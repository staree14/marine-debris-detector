services:
  - type: web
    name: marine-debris-detector-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: YOLO_CONFIG_DIR
        value: /tmp/Ultralytics
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "65536"
